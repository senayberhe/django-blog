# Render Blueprint: describes the whole deployment as code.
# Render reads this file and creates the database + web service for you.
databases:
  - name: blog-db
    plan: free            # NOTE: free Postgres is deleted 30 days after creation unless upgraded
    databaseName: blog
    user: blog

services:
  - type: web
    name: django-blog
    runtime: python
    plan: free            # sleeps after 15 min idle; first visit after that takes ~1 min
    buildCommand: ./build.sh
    startCommand: python -m gunicorn config.wsgi:application
    healthCheckPath: /robots.txt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blog-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true   # Render generates a random secret; you never see or commit it
      - key: WEB_CONCURRENCY
        value: 2              # Gunicorn worker processes; 2 fits the free plan's memory
      - key: BLOG_TITLE
        sync: false           # Render asks you for these values when you create the Blueprint
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
